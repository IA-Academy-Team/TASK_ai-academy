# =============================================================================
#  task.aiacademy.com.co — Task Ai Academy (monorepo ai-academy-centro-control)
#  VPS: vmi2746051 · Docker: app en 127.0.0.1:3012 (ver docker-compose.production.yml)
#  Certificado: ya emitido por Certbot como "task.aiacademy.com.co" (no re-emitir).
#  Instalar:  sudo cp deploy/nginx/task.aiacademy.com.co.conf /etc/nginx/sites-available/task-aiacademy
#             sudo ln -s /etc/nginx/sites-available/task-aiacademy /etc/nginx/sites-enabled/task-aiacademy
#             sudo nginx -t && sudo systemctl reload nginx
#  Reversa:   sudo rm /etc/nginx/sites-enabled/task-aiacademy && sudo nginx -t && sudo systemctl reload nginx
# =============================================================================
server {
    server_name task.aiacademy.com.co;

    server_tokens off;

    access_log /var/log/nginx/task-aiacademy-access.log;
    error_log  /var/log/nginx/task-aiacademy-error.log;

    add_header X-Robots-Tag              "noindex, nofollow" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Importación de Excel (multer limita a 5MB en la app, con margen)
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/task.aiacademy.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/task.aiacademy.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name task.aiacademy.com.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
