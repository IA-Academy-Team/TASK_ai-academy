# =============================================================================
#  control.uranigma.com — AI Academy · Centro de Control
#  Docker: app en 127.0.0.1:3012 (ver docker-compose.production.yml)
#  Instalar:  sudo cp deploy/nginx/control.uranigma.com.conf /etc/nginx/sites-available/control-uranigma
#             sudo ln -s /etc/nginx/sites-available/control-uranigma /etc/nginx/sites-enabled/control-uranigma
#             sudo nginx -t && sudo systemctl reload nginx
#  HTTPS:     sudo certbot --nginx -d control.uranigma.com   (agrega el bloque 443 y la redirección)
#  Reversa:   rm /etc/nginx/sites-enabled/control-uranigma && nginx -t && systemctl reload nginx
# =============================================================================
server {
    server_name control.uranigma.com;

    server_tokens off;

    access_log /var/log/nginx/control-uranigma-access.log;
    error_log  /var/log/nginx/control-uranigma-error.log;

    add_header X-Robots-Tag           "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "DENY" always;

    # Importación de Excel (multer limita a 5MB en la app, con margen)
    client_max_body_size 6m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    listen 80;
    listen [::]:80;
}
